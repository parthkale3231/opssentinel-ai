{{- if and .Values.postgres.enabled .Values.postgres.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "demostore.postgresName" . }}-pvc
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "demostore.labels" . | nindent 4 }}
spec:
  accessModes:
    - {{ .Values.postgres.persistence.accessMode }}
  storageClassName: {{ .Values.postgres.persistence.storageClass | quote }}
  resources:
    requests:
      storage: {{ .Values.postgres.persistence.size | quote }}
{{- end }}
