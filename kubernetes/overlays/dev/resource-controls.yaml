apiVersion: v1
kind: ResourceQuota
metadata:
  name: opssentinel-dev-quota
  namespace: opssentinel-dev
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 2Gi
    limits.cpu: "3"
    limits.memory: 3Gi
    pods: "10"
    persistentvolumeclaims: "3"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: opssentinel-dev-limits
  namespace: opssentinel-dev
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      default:
        cpu: 500m
        memory: 512Mi
