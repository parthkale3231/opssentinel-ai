apiVersion: apps/v1
kind: Deployment
metadata:
  name: demostore-api
  labels:
    app.kubernetes.io/name: demostore-api
    app.kubernetes.io/part-of: demostore
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: demostore-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: demostore-api
        app.kubernetes.io/part-of: demostore
    spec:
      containers:
        - name: api
          image: opssentinelai-demostore-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: demostore-api-config
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: demostore-db-secret
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: demostore-db-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: demostore-db-secret
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: postgresql+psycopg2://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@demostore-postgres:5432/$(POSTGRES_DB)
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
