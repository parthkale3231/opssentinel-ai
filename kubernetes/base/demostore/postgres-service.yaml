apiVersion: v1
kind: Service
metadata:
  name: demostore-postgres
  namespace: opssentinel
  labels:
    app.kubernetes.io/name: demostore-postgres
    app.kubernetes.io/part-of: demostore
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: demostore-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
      protocol: TCP
